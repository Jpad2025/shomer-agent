services:
  shomer-agent:
    build:
      context: .
      network: host
    image: shomer-agent:latest
    container_name: shomer-agent
    restart: unless-stopped
    network_mode: host          # acceso directo a la LAN del cliente
    env_file: .env
    environment:
      - TZ=America/Bogota
    volumes:
      - ./core:/app/core        # código Python — cambios en disco sin rebuild
      - ./data:/app/data        # devices.json persiste aquí
      - ./data/agent_restart_key:/app/data/agent_restart_key:ro
      - /storage/db:/storage/db:ro  # BDs Shomer (tracker, network_monitor) solo lectura
      - /opt/network_monitor/SITE.md:/app/docs/SITE.md:ro
      # Conocimiento operativo real (4 sep 2026) -- EQUIPOS.md tiene
      # arquitectura del sitio (VLANs, firewall, excepciones Hunter) que no
      # vive en ninguna tabla. Los 2 documentos de campo que estaban acá antes
      # (REVISION-EN-SITIO-OPERA.md, OPERA-VISIBILIDAD-CAPA2-RICARDO.md) se
      # quitaron -- eran tareas fechadas para una persona, ya completadas o
      # vencidas, no conocimiento permanente. La topología real (qué switch
      # alimenta qué zona) ya vive en infra_devices.location, siempre al día.
      - /opt/network_monitor/docs/EQUIPOS.md:/app/docs/EQUIPOS.md:ro
      # ── Solo laboratorio (AGENT_TECHNICIAN_ONLY=0): docs developer USB ─────
      # Descomenta si existen estos archivos en el host (Bogotá normalmente NO):
      # - /opt/network_monitor/CLAUDE.md:/app/docs/developer/CLAUDE.md:ro
      # - /opt/network_monitor/SISTEMA_SHOMER.md:/app/docs/developer/SISTEMA_SHOMER.md:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
